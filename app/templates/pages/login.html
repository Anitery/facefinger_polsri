<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Smart Door Lock Polsri</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  
  <style>
    body {
      background: linear-gradient(135deg, #1A2942 0%, #205B94 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px; /* Mencegah kartu menempel di layar HP */
    }
    .login-card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    }
    .login-card .logo {
      width: 72px; height: 72px;
      background: #1F3864;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 16px rgba(31, 56, 100, 0.2);
    }
    .login-card h4 {
      color: #1F3864;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-card .subtitle {
      color: #64748b;
      font-size: 0.875rem;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-label { 
      font-weight: 600; 
      font-size: 0.875rem; 
      color: #334155; 
      margin-bottom: 8px;
    }
    .form-control {
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #1e293b;
      transition: all 0.2s ease-in-out;
    }
    .form-control::placeholder {
      color: #94a3b8;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    .input-icon { position: relative; }
    .input-icon i.icon-left {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
    }
    .input-icon input { padding-left: 48px; }
    
    /* Perbaikan agar teks password tidak tertutup ikon mata */
    #passwordInput { padding-right: 48px; }
    
    .toggle-pw {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #64748b;
      font-size: 1.1rem;
      background: none;
      border: none;
      padding: 4px;
      transition: color 0.2s ease;
    }
    .toggle-pw:hover { color: #1e293b; }
    
    .btn-login {
      background: #1F3864;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }
    .btn-login:hover { 
      background: #152849; 
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(31, 56, 100, 0.25);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.875rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
    }
    .role-info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.8125rem;
      color: #0369a1;
      margin-top: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-card">

  <div class="logo">
    <i class="bi bi-shield-lock-fill text-white fs-2"></i>
  </div>

  <h4>Smart Door Lock</h4>
  <p class="subtitle">Ruang Multimedia — Jurusan Teknik Komputer Polsri</p>

  {% if error %}
  <div class="alert-error">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="mb-3">
      <label class="form-label">NIM / NIP</label>
      <div class="input-icon">
        <i class="bi bi-person icon-left"></i>
        <input
          type="text"
          name="nim_nip"
          class="form-control"
          placeholder="Masukkan NIM atau NIP"
          required
          autocomplete="username"
        />
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-icon">
        <i class="bi bi-lock icon-left"></i>
        <input
          type="password"
          name="password"
          id="passwordInput"
          class="form-control"
          placeholder="Masukkan password"
          required
          autocomplete="current-password"
        />
        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Toggle password visibility">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
    </button>
  </form>

  <div class="role-info">
    <i class="bi bi-info-circle-fill me-1"></i>
    Dashboard hanya dapat diakses oleh <strong>Admin</strong>,
    <strong>Teknisi</strong>, dan <strong>Dosen</strong>.
    Hubungi administrator untuk mendapatkan akses.
  </div>
</div>

<script>
function togglePw() {
  const input = document.getElementById('passwordInput');
  const icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
