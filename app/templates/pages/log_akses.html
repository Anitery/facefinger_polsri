{% extends "base.html" %}
{% block title %}Log Akses{% endblock %}
{% block page_title %}Log Akses{% endblock %}

{% block content %}

<!-- Filter bar — stack di mobile -->
<div class="section-card mb-3 p-3">
  <div class="row g-2 align-items-end">
    <div class="col-6 col-sm-auto">
      <label class="form-label mb-1" style="font-size:.78rem; color:#64748b;">Status</label>
      <select class="form-select form-select-sm" id="filterStatus">
        <option value="">Semua</option>
        <option value="berhasil">Berhasil</option>
        <option value="ditolak">Ditolak</option>
      </select>
    </div>
    <div class="col-6 col-sm-auto">
      <label class="form-label mb-1" style="font-size:.78rem; color:#64748b;">Metode</label>
      <select class="form-select form-select-sm" id="filterMetode">
        <option value="">Semua</option>
        <option value="face">Face</option>
        <option value="fingerprint">Fingerprint</option>
      </select>
    </div>
    <div class="col-auto ms-auto d-flex gap-2">
      <button class="btn btn-sm btn-primary" onclick="loadLog()">
        <i class="bi bi-arrow-clockwise"></i>
        <span class="d-none d-sm-inline ms-1">Refresh</span>
      </button>
      <a href="/log-akses/export/excel?ruangan_id=1"
         class="btn btn-sm btn-success">
        <i class="bi bi-file-earmark-excel"></i>
        <span class="d-none d-sm-inline ms-1">Excel</span>
      </a>
    </div>
  </div>
</div>

<!-- Tabel -->
<div class="tbl-wrap">
  <div style="overflow-x:auto;">
    <table class="table table-hover mb-0" style="min-width:520px;">
      <thead>
        <tr>
          <th>#</th>
          <th>Waktu</th>
          <th>Nama</th>
          <th>Metode</th>
          <th>Status</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="logBody">
        <tr><td colspan="6" class="text-center py-4 text-muted">Memuat...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="px-3 py-2 border-top d-flex justify-content-between align-items-center">
    <small class="text-muted" id="logInfo" style="font-size:.76rem;">—</small>
    <small class="text-muted" style="font-size:.73rem;">Auto-refresh 15s</small>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fmtTime(iso) {
  return new Date(iso).toLocaleString('id-ID', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}

async function loadLog() {
  const status = document.getElementById('filterStatus').value;
  const metode = document.getElementById('filterMetode').value;
  let url = '/log-akses/?limit=100&ruangan_id=1';
  if (status) url += '&status=' + status;
  if (metode) url += '&metode=' + metode;

  try {
    const res  = await fetch(url);
    const data = await res.json();
    document.getElementById('logInfo').textContent = `${data.length} entri`;

    const tbody = document.getElementById('logBody');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">
        <i class="bi bi-inbox d-block mb-2" style="font-size:2rem;"></i>Tidak ada data
      </td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(l => `
      <tr>
        <td class="text-muted" style="font-size:.75rem;">${l.id}</td>
        <td style="white-space:nowrap; font-size:.78rem;">${fmtTime(l.waktu_akses)}</td>
        <td>
          <div class="fw-bold" style="font-size:.83rem;">
            ${l.nama_user || '<span class="text-muted">Tidak dikenal</span>'}
          </div>
          ${l.nim_nip
            ? `<div style="font-size:.7rem;color:#94a3b8;">${l.nim_nip}</div>`
            : ''}
        </td>
        <td>
          ${l.metode === 'face'
            ? `<span class="badge-role"><i class="bi bi-camera me-1"></i>Face</span>`
            : l.metode === 'fingerprint'
            ? `<span style="background:#dcfce7;color:#15803d;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;">
                <i class="bi bi-fingerprint me-1"></i>FP
               </span>`
            : `<span style="background:#f1f5f9;color:#64748b;padding:3px 9px;border-radius:20px;font-size:.72rem;">
                ${l.metode}
               </span>`}
        </td>
        <td>
          ${l.status === 'berhasil'
            ? '<span class="badge-ok"><i class="bi bi-check-lg me-1"></i>Berhasil</span>'
            : '<span class="badge-no"><i class="bi bi-x-lg me-1"></i>Ditolak</span>'}
        </td>
        <td style="font-size:.78rem; color:#64748b; max-width:180px;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${l.keterangan || '—'}
        </td>
      </tr>`).join('');
  } catch(e) {
    document.getElementById('logBody').innerHTML =
      '<tr><td colspan="6" class="text-center py-4 text-danger">Gagal memuat data</td></tr>';
  }
}

loadLog();
setInterval(loadLog, 15000);
document.getElementById('filterStatus').addEventListener('change', loadLog);
document.getElementById('filterMetode').addEventListener('change', loadLog);
</script>
{% endblock %}
